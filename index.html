    :root {
      --primary-color: #4CAF50;
      --hover-color: #45a049;
      --bg-color: #f4f7f6;
      --text-color: #333;
      --card-bg: #fff;
    }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;

      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #app {
      background: var(--card-bg);
      width: 100%;
      max-width: 600px;
      margin: 20px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    h1, h2 {
      text-align: center;
      color: var(--text-color);
    }
    .hidden {
      display: none !important;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      background-color: var(--card-bg);
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }
    .btn:hover {
      background-color: var(--primary-color);
      color: #fff;
    }
    .btn-primary {
      background-color: var(--primary-color);
      color: #fff;
      text-align: center;
      font-weight: bold;
      border: none;
    }
    .btn-primary:hover {
      background-color: var(--hover-color);
    }
    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }
    .correct-btn {
      background-color: #4CAF50 !important;
      color: white !important;
      border-color: #4CAF50 !important;
    }
    .wrong-btn {
      background-color: #f44336 !important;
      color: white !important;
      border-color: #f44336 !important;
    }
    #progress {
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
      color: #666;
    }
    #question-text {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    #explanation-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #e8f5e9;
      border-left: 5px solid #4CAF50;
      border-radius: 4px;
    }
    .score-display {
      font-size: 24px;
      text-align: center;
      margin: 20px 0;
      font-weight: bold;
    }
    .high-score {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-top: 10px;

    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" class="hidden">
      <div id="progress">問題 1 / 10</div>
      <div id="question-text">ここに問題文が表示されます。</div>
      <div id="options-container">

        <p id="explanation-text"></p>
        <button class="btn btn-primary" onclick="nextQuestion()" style="margin-top: 15px;">次の問題へ</button>

      <button class="btn btn-primary" onclick="resetQuiz()" style="margin-top: 30px;">トップに戻る</button>
    </div>

    // ==========================================
    // 2. アプリのロジック
    // ==========================================
    const QUESTION_COUNT = 10; // 1回の出題数
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let isAnswered = false;

    // 初期化処理（最高得点の読み込み）
    window.onload = () => {
      const highScore = localStorage.getItem('geographyQuizHighScore') || 0;
      document.getElementById('high-score-display').innerText = `過去の最高得点: ${highScore}点`;
    };

    // クイズ開始
    function startQuiz() {
      // データをシャッフルして指定問題数だけ抽出
      currentQuestions = [...allQuizData].sort(() => 0.5 - Math.random()).slice(0, QUESTION_COUNT);
      
      // データが足りない場合のフォールバック
      if (currentQuestions.length === 0) {
        alert("クイズデータがありません。");
        return;
      }

      currentQuestionIndex = 0;
      score = 0;
      
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      
      showQuestion();
    }

    // 問題の表示
    function showQuestion() {
      isAnswered = false;
      document.getElementById('explanation-box').classList.add('hidden');
      
      const q = currentQuestions[currentQuestionIndex];
      document.getElementById('progress').innerText = `問題 ${currentQuestionIndex + 1} / ${currentQuestions.length} （${q.unit}）`;
      document.getElementById('question-text').innerText = q.question;
      
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';
      
      q.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = option;
        btn.onclick = () => checkAnswer(index, btn);
        optionsContainer.appendChild(btn);
      });
    }

    // 答え合わせ
    function checkAnswer(selectedIndex, selectedBtn) {
      if (isAnswered) return;
      isAnswered = true;
      
      const q = currentQuestions[currentQuestionIndex];
      const buttons = document.getElementById('options-container').querySelectorAll('button');
      
      // 正解不正解の判定とボタンの色付け
      buttons.forEach((btn, index) => {
        btn.disabled = true;
        if (index === q.answerIndex) {
          btn.classList.add('correct-btn');
        } else if (index === selectedIndex) {
          btn.classList.add('wrong-btn');
        }
      });

      const title = document.getElementById('result-title');
      if (selectedIndex === q.answerIndex) {
        title.innerText = "⭕ 正解！";
        title.style.color = "#4CAF50";
        score++;
      } else {
        title.innerText = "❌ 不正解...";
        title.style.color = "#f44336";
      }

      document.getElementById('explanation-text').innerText = q.explanation;
      document.getElementById('explanation-box').classList.remove('hidden');
    }

    // 次の問題へ
    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < currentQuestions.length) {
        showQuestion();
      } else {
        finishQuiz();
      }
    }

    // クイズ終了と結果表示
    function finishQuiz() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
      
      document.getElementById('final-score').innerText = `${currentQuestions.length}問中 ${score}問正解！`;

      // LocalStorageに最高得点を保存
      const currentHighScore = parseInt(localStorage.getItem('geographyQuizHighScore') || 0);
      const msgElement = document.getElementById('new-high-score-msg');
      
      if (score > currentHighScore) {
        localStorage.setItem('geographyQuizHighScore', score);
        msgElement.innerText = "🎉 最高得点を更新しました！";
        msgElement.classList.remove('hidden');
      } else {
        msgElement.classList.add('hidden');
      }
    }

    // トップに戻る
    function resetQuiz() {
      const highScore = localStorage.getItem('geographyQuizHighScore') || 0;
      document.getElementById('high-score-display').innerText = `過去の最高得点: ${highScore}点`;
      
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }
  </script>
